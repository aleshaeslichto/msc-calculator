<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Кредитный калькулятор</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="container">

  <h2>Кредитный калькулятор</h2>

  <label for="amount">Сумма кредита, ₽</label>
  <input type="number" id="amount" value="500000" />

  <label for="term">Срок кредита, мес.</label>
  <input type="number" id="term" value="12" />

  <label for="rateType">Выберите тип кредита / программу</label>
  <select id="rateType"></select>

  <label for="type">Тип платежа</label>
  <select id="type">
    <option value="annuity">Аннуитетный</option>
    <option value="diff">Дифференцированный</option>
  </select>

  <button onclick="calculate()">Рассчитать</button>

  <!-- Результат -->
  <div id="result" class="hidden"></div>

  <!-- Банки -->
  <div id="banks-list"></div>

</div>

<script src="config.js" defer></script>
<script src="calculator.js" defer></script>

</body>
</html>
